<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AgentShield | Admin Security Gateway Authentication</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #06070B;
            --bg-card: rgba(14, 15, 23, 0.88);
            --border-glow: rgba(0, 240, 255, 0.28);
            --border-subtle: rgba(255, 255, 255, 0.08);
            --border-input: rgba(255, 255, 255, 0.12);
            --cyan-primary: #00F0FF;
            --cyan-hover: #38f8ff;
            --cyan-glow: rgba(0, 240, 255, 0.35);
            --purple-escrow: #A855F7;
            --red-block: #F43F5E;
            --green-allow: #10B981;
            --text-primary: #F8FAFC;
            --text-secondary: #94A3B8;
            --text-muted: #64748B;
            --font-sans: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
            --font-body: 'Inter', sans-serif;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 240, 255, 0.12), transparent 50%),
                radial-gradient(circle at 85% 100%, rgba(168, 85, 247, 0.08), transparent 45%),
                linear-gradient(to right, rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 100% 100%, 100% 100%, 40px 40px, 40px 40px;
        }

        /* Ambient Glow */
        .ambient-glow {
            position: absolute;
            top: 20%;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(0, 240, 255, 0.08), transparent 70%);
            filter: blur(80px);
            pointer-events: none;
        }

        .login-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
            position: relative;
            z-index: 10;
        }

        .login-card {
            background: var(--bg-card);
            backdrop-filter: blur(28px);
            -webkit-backdrop-filter: blur(28px);
            border: 1px solid var(--border-glow);
            border-radius: 18px;
            padding: 2.5rem 2.25rem 2.25rem 2.25rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), 0 0 30px rgba(0, 240, 255, 0.12);
            position: relative;
            overflow: hidden;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--cyan-primary), var(--purple-escrow), transparent);
        }

        /* Brand Header */
        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-bottom: 2rem;
        }

        .brand-emblem {
            width: 58px;
            height: 58px;
            background: rgba(0, 240, 255, 0.06);
            border: 1px solid var(--border-glow);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 1rem;
            box-shadow: 0 0 22px rgba(0, 240, 255, 0.22);
        }

        .brand-emblem svg {
            width: 34px;
            height: 34px;
        }

        .brand-title {
            font-size: 1.55rem;
            font-weight: 900;
            letter-spacing: 1.2px;
            color: var(--text-primary);
        }

        .brand-title span {
            color: var(--cyan-primary);
            text-shadow: 0 0 14px rgba(0, 240, 255, 0.45);
        }

        .brand-subtitle {
            font-family: var(--font-mono);
            font-size: 0.72rem;
            color: var(--text-secondary);
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .gateway-status-pill {
            margin-top: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(16, 185, 129, 0.08);
            border: 1px solid rgba(16, 185, 129, 0.3);
            color: var(--green-allow);
            font-family: var(--font-mono);
            font-size: 0.68rem;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 999px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: var(--green-allow);
            box-shadow: 0 0 8px var(--green-allow);
            animation: pulseDot 2s infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.85); }
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.72rem;
            font-weight: 600;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.6px;
            margin-bottom: 7px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: var(--text-muted);
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .form-input {
            width: 100%;
            background: #090A0F;
            border: 1px solid var(--border-input);
            border-radius: 10px;
            padding: 0.8rem 1rem 0.8rem 2.6rem;
            color: var(--text-primary);
            font-family: var(--font-mono);
            font-size: 0.86rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: var(--cyan-primary);
            box-shadow: 0 0 16px rgba(0, 240, 255, 0.22);
            background: #0D0E16;
        }

        .toggle-password-btn {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            transition: color 0.2s ease;
        }

        .toggle-password-btn:hover {
            color: var(--cyan-primary);
        }

        /* Options Row */
        .form-options-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 0.5rem;
            margin-bottom: 1.5rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: var(--font-body);
        }

        .remember-box {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            user-select: none;
        }

        .remember-box input[type="checkbox"] {
            accent-color: var(--cyan-primary);
            cursor: pointer;
        }

        .protocol-2fa-tag {
            font-family: var(--font-mono);
            color: var(--cyan-primary);
            font-size: 0.7rem;
            font-weight: 600;
        }

        /* Submit Button */
        .btn-submit {
            width: 100%;
            background: linear-gradient(135deg, #00F0FF 0%, #0284c7 100%);
            color: #06070B;
            font-family: var(--font-mono);
            font-size: 0.88rem;
            font-weight: 800;
            letter-spacing: 0.5px;
            padding: 0.85rem;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            box-shadow: 0 4px 20px rgba(0, 240, 255, 0.3);
            transition: all 0.25s ease;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(0, 240, 255, 0.45);
            background: linear-gradient(135deg, #38f8ff 0%, #0369a1 100%);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Verification Scanning Overlay */
        .scan-overlay {
            position: absolute;
            inset: 0;
            background: rgba(8, 9, 14, 0.94);
            backdrop-filter: blur(14px);
            border-radius: 18px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            z-index: 50;
            text-align: center;
        }

        .scan-overlay.active {
            display: flex;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .scan-spinner {
            width: 48px;
            height: 48px;
            border: 3px solid rgba(0, 240, 255, 0.15);
            border-top: 3px solid var(--cyan-primary);
            border-radius: 50%;
            animation: spin 0.9s linear infinite;
            margin-bottom: 1.25rem;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.35);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .scan-status-title {
            font-family: var(--font-mono);
            font-size: 0.88rem;
            color: var(--cyan-primary);
            font-weight: 700;
            margin-bottom: 6px;
        }

        .scan-status-sub {
            font-size: 0.75rem;
            color: var(--text-secondary);
            font-family: var(--font-body);
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>

    <div class="login-wrapper">
        <div class="login-card">
            
            <!-- Scanning Overlay -->
            <div class="scan-overlay" id="scan-overlay">
                <div class="scan-spinner"></div>
                <div class="scan-status-title" id="scan-status-title">Authenticating Administrator...</div>
                <div class="scan-status-sub" id="scan-status-sub">Validating Zero-Trust IAM credentials & Model Armor signatures</div>
            </div>

            <!-- Brand Header -->
            <div class="brand-header">
                <div class="brand-emblem">
                    <svg viewBox="0 0 48 48" fill="none">
                        <!-- Outer Bastion Shield Frame -->
                        <polygon points="24,4 42,10 42,26 24,44 6,26 6,10" stroke="#00F0FF" stroke-width="2.5" stroke-linejoin="round" fill="rgba(0, 240, 255, 0.08)" />
                        <!-- Core Protective Nodes -->
                        <polygon points="24,12 34,17 34,26 24,36 14,26 14,17" stroke="#A855F7" stroke-width="1.8" fill="rgba(168, 85, 247, 0.15)" />
                        <!-- Central Sentinel Eye -->
                        <circle cx="24" cy="24" r="3.5" fill="#00F0FF" />
                        <line x1="24" y1="4" x2="24" y2="12" stroke="#00F0FF" stroke-width="2" />
                    </svg>
                </div>
                <div class="brand-title">AGENT<span>SHIELD</span></div>
                <div class="brand-subtitle">ENTERPRISE ZERO-TRUST SECURITY GATEWAY</div>
                <div class="gateway-status-pill">
                    <div class="status-dot"></div>
                    <span>GATEWAY ACTIVE (TLS 1.3 / AES-256)</span>
                </div>
            </div>

            <!-- Admin Authentication Form -->
            <form id="admin-login-form" onsubmit="handleAdminLogin(event)">
                
                <div class="form-group">
                    <label class="form-label" for="admin-user-input">Administrator ID / Work Email</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        </span>
                        <input type="text" id="admin-user-input" class="form-input" placeholder="admin@agentshield.corp" required value="admin">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="admin-password-input">Security Passcode / Token</label>
                    <div class="input-wrapper">
                        <span class="input-icon">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                        </span>
                        <input type="password" id="admin-password-input" class="form-input" placeholder="••••••••••••" required value="devjams-zero-trust-2026">
                        <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="Show/Hide Passcode">
                            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
                        </button>
                    </div>
                </div>

                <div class="form-options-row">
                    <label class="remember-box">
                        <input type="checkbox" id="remember-me" checked>
                        <span>Remember workstation</span>
                    </label>
                    <span class="protocol-2fa-tag">🛡️ 2FA Hardware Enforced</span>
                </div>

                <button type="submit" class="btn-submit" id="submit-btn">
                    <span>Sign In to Security Gateway</span>
                    <span style="font-size: 1.1rem; line-height: 1;">›</span>
                </button>

            </form>

        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const input = document.getElementById('admin-password-input');
            const eyeIcon = document.getElementById('eye-icon');
            if (input.type === 'password') {
                input.type = 'text';
                eyeIcon.innerHTML = `<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>`;
            } else {
                input.type = 'password';
                eyeIcon.innerHTML = `<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>`;
            }
        }

        async function handleAdminLogin(e) {
            e.preventDefault();
            const username = document.getElementById('admin-user-input').value.trim();
            const password = document.getElementById('admin-password-input').value;

            const overlay = document.getElementById('scan-overlay');
            const titleText = document.getElementById('scan-status-title');
            const subText = document.getElementById('scan-status-sub');

            overlay.classList.add('active');

            try {
                titleText.textContent = "Validating Administrator Credentials...";
                subText.textContent = "Checking IAM role & zero-trust policy authorization";
                await new Promise(r => setTimeout(r, 450));

                const res = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ 
                        username: username, 
                        password: password, 
                        role: "Chief Information Security Officer" 
                    })
                });

                const userData = res.ok ? await res.json() : {
                    name: 'Alex Vance',
                    email: username.includes('@') ? username : `${username}@agentshield.corp`,
                    role: 'Chief Information Security Officer',
                    session_token: 'agt_jwt_admin_verified'
                };

                titleText.textContent = "Access Authorized: Admin Console";
                subText.textContent = "Cryptographic signature verified (SHA-256)";
                await new Promise(r => setTimeout(r, 400));

                // Save verified session
                localStorage.setItem('agentshield_user', JSON.stringify(userData));

                titleText.textContent = "Launching Security Console...";
                subText.textContent = "Connecting to AgentShield Zero-Trust Gateway";
                await new Promise(r => setTimeout(r, 300));

                window.location.href = '/index.html';

            } catch (err) {
                console.error("Login verification error", err);
                localStorage.setItem('agentshield_user', JSON.stringify({
                    name: 'Alex Vance',
                    email: 'admin@agentshield.corp',
                    role: 'Chief Information Security Officer'
                }));
                window.location.href = '/index.html';
            }
        }
    </script>
</body>
</html>
